services:
  - type: web
    name: ambassadors-interschool
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # paste the Postgres connection string in the Render dashboard
      - key: CREATOR_EMAIL
        sync: false # the organisation's email; whoever signs up with it gets Creator Control
      - key: TOKEN_SECRET
        generateValue: true

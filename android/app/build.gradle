apply plugin: "com.android.application"

android {
    namespace "org.ambassadorsfootball.interschool"
    compileSdk 36

    defaultConfig {
        applicationId "org.ambassadorsfootball.interschool"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        // The live app this APK opens. Change it here if the app moves.
        buildConfigField "String", "APP_URL", "\"https://rafiki-games.onrender.com/interschool/\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so it installs directly from WhatsApp.
            // For the Play Store, create a real upload key instead.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
